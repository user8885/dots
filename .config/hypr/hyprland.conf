monitor = HDMI-A-1,1920x1080@100, 0x0, 1

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    col.active_border = rgb(BD93F9) rgb(FF79C6) 90deg
    col.inactive_border = rgb(44475A)
    col.nogroup_border = rgb(44475A)
    col.nogroup_border_active = rgb(BD93F9) rgb(BD93F9) 90deg

    gaps_in = 2
    gaps_out = 4

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    border_size = 2
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5

    blur {
        enabled = true
        size = 15
        passes = 2
        new_optimizations = true
        ignore_opacity=true
    }

}
layerrule = blur on
layerrule = blur_popups on

group {
    groupbar {
        col.active = rgb(bd93f9) rgb(44475a) 90deg
        col.inactive = rgba(282a36dd)
    }
}

animations {
    enabled = yes

    animation = global, 1, 3, default
    animation = windows, 1, 2.5, default, popin
    animation = layers, 1, 1.5, default, popin 
    animation = workspaces, 1, 3, default, slidevert
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    #pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = off
}

# RULES
windowrule = match:class .* suppress_event maximize

windowrule = match:class xwaylandvideobridge, workspace special:minimize silent

# allow tearing on certain workspaces
windowrule = match:workspace 4, immediate on
windowrule = match:workspace 5, immediate on

windowrule = match:title ^(dm-logout)$, float on
windowrule = match:title ^(YAD)$,       float on
windowrule = match:class nwg-look,  float on

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # 0/1 = no wallpaper, -1 = anime wallpapers :)
    disable_hyprland_logo = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_options = caps:swapescape

    natural_scroll = yes
    force_no_accel = 1
    follow_mouse = 1
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
#device {
#    name = logitech-usb-receiver-mouse
#}

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

source = ~/.config/hypr/keys.conf

exec-once = ~/.config/hypr/autostart

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP 
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
