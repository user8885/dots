[General]
BackupBeforeSave=true
BackupFilePathPattern=/home/user/Documents/Passwords/Old_Passwords/{DB_FILENAME}+{TIME:yyyy_MM_dd_hh-mm-ss}.old.kdbx
ConfigVersion=2

[Browser]
AlwaysAllowAccess=true
CustomProxyLocation=
Enabled=true

[FdoSecrets]
Enabled=false

[GUI]
ApplicationTheme=dark
MinimizeOnClose=true
MinimizeOnStartup=true
MinimizeToTray=false
ShowTrayIcon=true
TrayIconAppearance=monochrome-light

[KeeShare]
Active="<?xml version=\"1.0\"?><KeeShare><Active/></KeeShare>\n"
Own="<?xml version=\"1.0\"?><KeeShare><PrivateKey></PrivateKey><PublicKey><Signer>user</Signer><Key></Key></PublicKey></KeeShare>\n"
QuietSuccess=true

[PasswordGenerator]
AdditionalChars=
EASCII=true
ExcludedChars=
WordCase=2
WordSeparator=-

[Security]
IconDownloadFallback=true
LockDatabaseIdleSeconds=180
